[package]
name = "prozesslotse"
version = "0.2.0"
description = "Prozesslotse: Geschäftsprozesse geführt modellieren, als BPMN zeichnen und verbessern"
authors = ["Robin Olbricht"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "prozesslotse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# PDF direkt aus der WebView2; die Versionen müssen zu denen passen, die Tauri selbst nutzt.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

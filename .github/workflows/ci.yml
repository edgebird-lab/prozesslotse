name: Prüfung

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Mehrere Browsertests der Compliance-Doku messen Textbreiten (Tabellen im Panel und im Druck, schmale
      # Fenster). Unter Linux setzt Chrome für „system-ui“ DejaVu Sans ein, rund 10 % breiter als Segoe UI
      # unter Windows, für das die Oberfläche abgenommen ist. Liberation Sans (Maße wie Arial) liegt nah an
      # Segoe UI; mit Verdana (Maße wie DejaVu) scheitern dieselben 9 Tests auch unter Windows.
      - name: Schrift mit Windows-Maßen
        run: |
          fc-list | grep -qi 'Liberation Sans' || { sudo apt-get update && sudo apt-get install -y fonts-liberation; }
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias binding="strong"><family>sans</family><prefer><family>Liberation Sans</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f >/dev/null
          fc-match system-ui; fc-match sans-serif
      # Browsertests mit dem vorinstallierten Chrome des Runners
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ergebnisse
          path: test-results
          retention-days: 7
